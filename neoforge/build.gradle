plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${rootProject.mod_id}-neoforge"
}

ext.rinlibRoot = rootProject.projectDir
ext.target = rootProject.rinlibTargets.find { it.minecraft == rootProject.minecraft_version && it.loader == 'neoforge' }
sourceSets.main.java.setSrcDirs(target.adapters.collect { rootProject.file(it) })
(target.api ?: [:]).each { className, interval ->
    sourceSets.main.java.srcDir new File(rinlibRoot, "adapters/api/${className}/${interval}")
}
sourceSets.test.java.srcDir rootProject.file('common/src/test/java')
sourceSets.test.java.srcDir rootProject.file('structure-tests')
sourceSets.test.java.srcDir rootProject.file('api-tests')
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
apply from: rootProject.file('profiles/metadata.gradle')

neoForge {
    version = target.dependencies.neoforge
    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods.rinlib
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateMetadata')



publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }
}

tasks.named('runServer') { standardInput = System.in }

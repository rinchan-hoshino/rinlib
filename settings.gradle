pluginManagement {
    def targets = new groovy.json.JsonSlurper().parse(file('support/profiles.json')).profiles
    def fabric = targets.find { it.minecraft == '1.21.1' && it.loader == 'fabric' }
    def neoforge = targets.find { it.minecraft == '1.21.1' && it.loader == 'neoforge' }
    plugins {
        id 'fabric-loom' version fabric.dependencies.loom
        id 'net.fabricmc.fabric-loom-companion' version fabric.dependencies.loom
        id 'net.neoforged.moddev' version neoforge.dependencies.moddev
    }
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'rinlib'
include 'common', 'fabric', 'neoforge'

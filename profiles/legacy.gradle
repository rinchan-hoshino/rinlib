buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'dev.rinchan'
def config = new Properties()
file('../gradle.properties').withInputStream { config.load(it) }
version = config.mod_version.split('\\+')[0] + '+1.12.2'
buildDir = file('../build/profiles/1.12.2-forge')
archivesBaseName = 'rinlib-forge'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'snapshot_20171003'
    replace '@VERSION@', project.version
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version
    }
}


sourceSets.main.java {
    srcDirs = ['../common/src/main/java', '../adapters/legacy']
    include 'dev/rinchan/rinlib/state/SharedOwnerState.java',
            'dev/rinchan/rinlib/state/StickyBoolean.java', 'dev/rinchan/rinlib/forge/**'
}
sourceSets.main.resources.srcDir 'legacy-resources'
jar { from '../LICENSE' }

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

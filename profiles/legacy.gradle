buildscript {
    def selected = new groovy.json.JsonSlurper().parse(file('../support/profiles.json')).profiles.find {
        it.minecraft == gradle.startParameter.projectProperties['profile'] && it.loader == 'forge'
    }
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:${selected.dependencies.forgegradle}"
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

ext.target = new groovy.json.JsonSlurper().parse(file('../support/profiles.json')).profiles.find {
    it.minecraft == project.property('profile') && it.loader == project.property('loader')
}
group = 'dev.rinchan'
def config = new Properties()
file('../gradle.properties').withInputStream { config.load(it) }
version = config.mod_version.tokenize('+')[0] + '+' + target.minecraft
buildDir = file("../build/profiles/${target.minecraft}-${target.loader}")
archivesBaseName = 'rinlib-forge'
sourceCompatibility = targetCompatibility = JavaVersion.toVersion(target.java)

minecraft {
    version = target.minecraft + '-' + target.dependencies.forge
    runDir = 'run'
    mappings = target.dependencies.mappings
    replace '@VERSION@', project.version
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand version: project.version
    }
}


sourceSets.main.java.srcDirs = target.adapters.collect { file('../' + it) }
sourceSets.main.resources.srcDir 'legacy-resources'
jar { from '../LICENSE' }

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

buildscript {
    def selected = new groovy.json.JsonSlurper().parse(file('../support/profiles.json')).profiles.find {
        it.minecraft == gradle.startParameter.projectProperties['profile'] && it.loader == 'forge'
    }
    if (selected.adapters.contains('adapters/structure-shared') || selected.adapters.contains('adapters/commands-modern')) {
        repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }; mavenCentral() }
        dependencies { classpath "org.spongepowered:mixingradle:${selected.dependencies.mixin_gradle}" }
    }
}
plugins { id 'net.minecraftforge.gradle' }
apply plugin: 'java-library'
apply from: 'common.gradle'
minecraft { mappings channel: 'official', version: target.minecraft }
dependencies { minecraft "net.minecraftforge:forge:${target.minecraft}-${target.dependencies.forge}" }
// Forge 1.20.6+ runs on Mojang names, so only older targets need the reobf step.
// Newer ForgeGradle also pulls Minecraft's natives patch jars from libraries.minecraft.net.
// That repo goes first: Gradle resolves a module from the first repo holding its POM, and
// Central's lwjgl POM has no macOS patch jar.
if (target.dependencies.reobf == false) {
    repositories.clear()
    repositories {
        maven { url = 'https://libraries.minecraft.net/' }
        mavenCentral()
    }
} else {
    jar.finalizedBy('reobfJar')
}

def mixinConfigs = target.adapters.collectMany { directory ->
    def resources = new File(rinlibRoot, directory + '/resources')
    (resources.listFiles() ?: []).findAll { it.name.endsWith('.mixins.json') }.collect { it.name }
}
if (!mixinConfigs.isEmpty()) {
    apply plugin: 'org.spongepowered.mixin'
    dependencies { annotationProcessor "org.spongepowered:mixin:${target.dependencies.mixin}:processor" }
    mixin {
        add sourceSets.main, 'rinlib.structure.refmap.json'
        mixinConfigs.each { config it }
    }
    jar { manifest.attributes('MixinConfigs': mixinConfigs.join(',')) }
}

// Keep a named artifact for consumers compiling or running ordinary JVM tests.
tasks.register('devJar', Jar) {
    archiveClassifier.set('dev')
    from sourceSets.main.output
}
tasks.named('assemble') { dependsOn 'devJar' }

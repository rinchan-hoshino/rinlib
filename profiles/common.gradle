import groovy.json.JsonSlurper

ext.rinlibRoot = rootProject.file('..')
def config = new Properties()
new File(rinlibRoot, 'gradle.properties').withInputStream { config.load(it) }
ext.target = new JsonSlurper().parse(new File(rinlibRoot, 'support/profiles.json')).profiles.find {
    it.minecraft == project.property('profile') && it.loader == project.property('loader')
}
if (target == null) throw new GradleException('No Minecraft/loader target matches')
if (project.hasProperty('runtimeMinecraft') && project.property('runtimeMinecraft') != target.minecraft) {
    throw new GradleException('Select the exact Minecraft target instead of a compatibility alias')
}
group = config.mod_group_id
version = config.mod_version.tokenize('+')[0] + '+' + target.minecraft
layout.buildDirectory.set(new File(rinlibRoot, "build/profiles/${target.minecraft}-${target.loader}"))
base { archivesName = "rinlib-${target.loader}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets.main.java.setSrcDirs(target.adapters.collect { new File(rinlibRoot, it) })
(target.api ?: [:]).each { className, interval ->
    sourceSets.main.java.srcDir new File(rinlibRoot, "adapters/api/${className}/${interval}")
}
if (target.adapters.contains('adapters/structure-shared')) {
    sourceSets.test.java.srcDir new File(rinlibRoot, 'structure-tests')
}
apply from: 'metadata.gradle'

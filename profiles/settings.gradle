pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
rootProject.name = 'rinlib-profile'
def profile = gradle.startParameter.projectProperties['profile']
def loader = gradle.startParameter.projectProperties['loader']
rootProject.buildFileName = profile == '1.12.2' ? 'legacy.gradle' :
        loader == 'fabric' && profile.startsWith('26.') ? 'fabric-modern.gradle' : "${loader}.gradle"

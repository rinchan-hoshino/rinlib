plugins { id 'net.neoforged.moddev' }
apply from: 'common.gradle'
neoForge {
    version = target.dependencies.neoforge
    mods { rinlib { sourceSet sourceSets.main } }
    // Older NeoForge has no JUnit run type; only these adapters need MC-bound tests.
    if (target.adapters.contains('adapters/structure-shared')) {
        unitTest {
            enable()
            testedMod = mods.rinlib
        }
    }
}

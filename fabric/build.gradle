plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom'
}

def root = rootProject

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-fabric"
}

ext.rinlibRoot = rootProject.projectDir
ext.target = rootProject.rinlibTargets.find { it.minecraft == root.minecraft_version && it.loader == 'fabric' }
sourceSets.main.java.setSrcDirs(target.adapters.collect { root.file(it) })
(target.api ?: [:]).each { className, interval ->
    sourceSets.main.java.srcDir new File(rinlibRoot, "adapters/api/${className}/${interval}")
}
sourceSets.test.java.srcDir root.file('common/src/test/java')
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
apply from: root.file('profiles/metadata.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${target.dependencies.fabric_loader}"
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-fabric"
            from components.java
        }
    }
}

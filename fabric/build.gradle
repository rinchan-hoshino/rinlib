plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom'
}

def root = rootProject

def modId = root.property('mod_id')

base {
    archivesName = "${modId}-fabric"
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('adapters/shared')
sourceSets.main.java.srcDir rootProject.file('adapters/commands-modern')
sourceSets.main.java.srcDir rootProject.file('adapters/data-components')
sourceSets.main.java.srcDir rootProject.file('adapters/player-1.21')
sourceSets.main.java.srcDir rootProject.file('adapters/item-1.21')
sourceSets.main.java.srcDir rootProject.file('adapters/structure-shared')
sourceSets.main.java.srcDir rootProject.file('adapters/structure-1.21')
sourceSets.main.resources.srcDir rootProject.file('adapters/structure-shared/resources')
sourceSets.main.resources.srcDir rootProject.file('adapters/commands-modern/resources')
sourceSets.test.java.srcDir root.file('common/src/test/java')

dependencies {
    minecraft "com.mojang:minecraft:${root.property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${root.property('fabric_loader_version')}"
}

def resourceProperties = [
    java_version: root.property('java_version'),
    mod_id: modId,
    mod_name: root.property('mod_name'),
    mod_version: root.property('mod_version'),
    mod_license: root.property('mod_license'),
    mod_authors: root.property('mod_authors'),
    mod_description: root.property('mod_description'),
    minecraft_version: root.property('minecraft_version'),
    fabric_loader_version: root.property('fabric_loader_version')
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-fabric"
            from components.java
        }
    }
}

sourceSets.main.java.srcDir rootProject.file('adapters/structure-legacy-hooks')
